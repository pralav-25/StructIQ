name: Validate StructIQ
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: structiq
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: structiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Run integration and scoring tests
        run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://structiq:test-only-password@localhost:5432/structiq_test' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests-web/*.test.mjs
      - run: node --check public/static/app.js
