target-version = "py312"
line-length = 100
exclude = ["public/static/vendor"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

# Test database selection must happen before the application imports its engine.
[lint.per-file-ignores]
"tests/test_api.py" = ["E402"]
